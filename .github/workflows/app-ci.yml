# Checks the Jachi Health app on every push to the "app" branch: installs its packages, then runs app/scripts/ci.sh
# (package versions, TypeScript, tests, Expo Doctor, native settings, iOS/Android/web bundles).
# Results go back to the branch in app/.ci/ (report.md and the generated native settings). The packages' type
# definitions go to the "app-types" branch and a web build for screenshots to the "app-preview" branch.
name: app-ci
on:
  push:
    branches: [app]
    paths: ['app/**', '!app/.ci/**', 'tools/app_*.py', '.github/workflows/app-ci.yml']
permissions:
  contents: write
concurrency:
  group: app-ci
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('app/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install packages
        working-directory: app
        run: |
          mkdir -p .ci
          npm install --no-audit --no-fund > .ci/install.log 2>&1 || { tail -80 .ci/install.log; exit 1; }
          npx expo install --fix >> .ci/install.log 2>&1 || true
          tail -40 .ci/install.log
      - name: Checks
        id: checks
        working-directory: app
        continue-on-error: true
        run: bash scripts/ci.sh
      - name: Save results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "jachi-ci"
          git config --global user.email "ci@jachihealth.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish() {
            (cd "$2" && git init -q -b "$1" && git add -A && git commit -qm "$3" && git push -qf "$remote" "$1")
          }
          if [ -d app/node_modules ]; then
            T=$(mktemp -d)
            (cd app/node_modules && {
              find . -type f \( -name '*.d.ts' -o -name '*.d.mts' -o -name '*.d.cts' -o -name 'package.json' \
                -o -name 'tsconfig*.json' -o -iname 'license*' \) -not -path './typescript/*' -not -path './.cache/*'
              cat ../.ci/ts-sources.txt 2>/dev/null
            } | sort -u | tar -czf "$T/types.tgz" -T -)
            cp app/package-lock.json "$T/" 2>/dev/null || true
            du -h "$T/types.tgz"
            publish app-types "$T" "Type definitions for local checks (${GITHUB_SHA})"
          fi
          if [ -f app/.ci-dist/web/index.html ]; then
            publish app-preview app/.ci-dist/web "Web build for screenshots (${GITHUB_SHA})"
          fi
          git add app/.ci/report.md app/.ci/native app/package.json app/package-lock.json
          git commit -qm "CI: app check results [skip ci]" || exit 0
          git push -q || { git pull -q --rebase && git push -q; }
      - name: Result
        if: steps.checks.outcome == 'failure'
        run: |
          grep -E '^- (pass|FAIL)' app/.ci/report.md || true
          exit 1
