# Netlify reads this file on every deploy. Settings here override the ones in Netlify's dashboard.

[build]
  # The site is built locally with `python3 build.py` and the output is committed,
  # so Netlify has nothing to build. It just publishes this folder.
  publish = "public"
  # Skip the deploy when a commit only changes the mobile app (app/) or GitHub workflow files, since each
  # production deploy uses 15 credits. git exits 0 (skip) when nothing else changed since the last deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)app' ':(exclude).github'"

[functions]
  # Server code: the help chat (/api/chat), account deletion (/api/account/delete) and the admin console (/api/admin/*).
  directory = "netlify/functions"

# Security headers for every page and file.
# The Content-Security-Policy only allows the site's own files (fonts included) and its own /api/ and
# /.netlify/identity addresses (accounts),
# so visitors' browsers never contact another company. If you add an outside service (analytics,
# video visits, a booking widget), it must be added here or the browser will block it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Font files have the contents' fingerprint in their names, so browsers can keep them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The account and admin pages are private tools: keep them out of search results.
[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/es/account/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
# Ad landing pages: for ad traffic only. The service pages are the ones search engines should show.
[[headers]]
  for = "/join/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/es/unase/*"
  [headers.values]
    X-Robots-Tag = "noindex"
