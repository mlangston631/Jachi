<main id="main">
  <section class="page-top" aria-labelledby="page-title">
    {{MARK:m-art-learn:outline:page-top__art}}
    <div class="wrap page-top__inner">
      {{CRUMBS}}
      <h1 class="display display--page" id="page-title">{{HUB_H1}}</h1>
      <p class="lead">{{HUB_LEAD}}</p>
    </div>
  </section>

  <section class="section section--paper" aria-label="{{HUB_LIST_LABEL}}">
    <div class="wrap">
      <ul class="guides guides--hub">{{HUB_CARDS}}</ul>
      <p class="note-box">{{I:info}}<span>{{HUB_NOTE}}</span></p>
    </div>
  </section>

  <section class="section join grain on-dark page-cta" aria-labelledby="cta-title">
    {{MARK:m-art-cta:outline:join__art}}
    <div class="wrap page-cta__inner">
      <h2 class="h2 h2--light" id="cta-title">{{CTA_TITLE}}</h2>
      <p class="lead lead--light">{{CTA_LEAD}}</p>
      <a class="btn btn--light btn--lg" href="{{JOIN_HREF}}">{{CTA_JOIN}} {{I:arrow:i--arrow}}</a>
    </div>
  </section>
</main>
