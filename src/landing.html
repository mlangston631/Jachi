<a class="skip" href="#main">{{LP_SKIP}}</a>

<header class="lp-head">
  <div class="wrap lp-head__bar">
    <a class="brand brand--light" href="{{LP_HOME}}" aria-label="{{LP_HOME_LABEL}}">
      {{MARK:m-lp:full}}
      <span class="brand__word" aria-hidden="true"><b>Jachi</b> <span>Health</span></span>
    </a>
    <a class="lang-switch" href="{{LP_ALT}}" hreflang="{{LP_ALT_LANG}}" lang="{{LP_ALT_LANG}}">{{LP_ALT_LABEL}}</a>
  </div>
</header>

<main id="main">
  <section class="section join grain on-dark lp-hero" id="join" aria-labelledby="lp-title">
    {{MARK:m-lp-art:outline:join__art}}
    <div class="wrap lp-hero__grid">
      <div class="lp-hero__head">
        <p class="status status--light"><span class="status__dot" aria-hidden="true"></span><span>{{LP_OPEN}}</span><span class="status__rule" aria-hidden="true"></span><span>{{LP_TEXAS}}</span></p>
        <h1 class="display display--lp" id="lp-title">{{LP_H1}}</h1>
        <p class="lead lead--light">{{LP_LEAD}}</p>
      </div>
      {{LP_FORM}}
      <div class="lp-hero__more">
        <ul class="perks lp-points">{{LP_POINTS}}</ul>
        <h2 class="join__next">{{LP_NEXT_TITLE}}</h2>
        {{LP_NEXT}}
      </div>
    </div>
  </section>

  <section class="section lp-helps" aria-labelledby="lp-helps-title">
    <div class="wrap lp-helps__grid">
      <div class="lp-helps__main">
        <h2 class="h2 h2--sm" id="lp-helps-title">{{LP_HELPS_TITLE}}</h2>
        <ul class="lp-list">{{LP_HELPS}}</ul>
      </div>
      {{LP_SAFETY}}
    </div>
  </section>

  <section class="section section--paper" aria-labelledby="lp-faq-title">
    <div class="wrap lp-faq">
      <h2 class="h2 h2--sm" id="lp-faq-title">{{LP_FAQ_TITLE}}</h2>
      <div class="faq-list">{{LP_FAQ}}</div>
    </div>
  </section>
</main>
